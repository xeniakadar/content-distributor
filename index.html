<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Distributor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Content Distributor</h1>
        <p class="intro">
          Enter a topic or rough idea to generate insights, angles, hooks, and a
          LinkedIn post.
        </p>

        <form id="generator-form">
          <label class="label" for="topic">Topic</label>
          <textarea
            id="topic"
            rows="6"
            placeholder="Paste source text, a topic, notes, or a rough idea."
          ></textarea>

          <button id="generate-button" type="submit">
            <span id="button-text">Generate Content</span>
          </button>
        </form>

        <p id="status-message" class="status-message" aria-live="polite"></p>
      </section>

      <section id="output" class="card hidden" aria-live="polite">
        <div class="output-header">
          <h2>Generated Content</h2>
          <p id="summary"></p>
        </div>

        <div id="insights" class="stack"></div>

        <div class="linkedin">
          <h2>LinkedIn Post</h2>
          <article id="linkedin-post" class="linkedin-post"></article>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
